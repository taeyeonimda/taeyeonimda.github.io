name: "Build and Deploy"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - AI_BLOG_AUTOMATION_PLAN.md
      - "salesforce-samples/**"
      - ".github/workflows/sf_org_deploy.yml"
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  issues: write

# Queue deployments sequentially so preview updates and merges never cancel each other
concurrency:
  group: "pages-deploy-global"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare helper script
        run: cp _automation/build_pr_comment.py /tmp/build_pr_comment.py

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Sync PR Previews (Build / Clean up)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -e
          MAIN_SHA=$(git rev-parse "origin/${DEFAULT_BRANCH}")

          # 1. pr-previews 브랜치 준비
          PREVIEW_REPO="/tmp/pr_previews_repo"
          rm -rf "${PREVIEW_REPO}"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${PREVIEW_REPO}"
          cd "${PREVIEW_REPO}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin pr-previews >/dev/null 2>&1; then
            git fetch origin pr-previews --depth 1
            git checkout -B pr-previews FETCH_HEAD
          else
            git checkout --orphan pr-previews
            git rm -rf . >/dev/null 2>&1 || true
            rm -rf ./*
          fi
          mkdir -p pr-preview
          touch .nojekyll

          build_and_store_pr() {
            local pr_num="$1"
            local ref_to_build="$2"
            local send_comment="$3"

            echo "[Preview] Building PR #${pr_num} (${ref_to_build})..."
            cd "${GITHUB_WORKSPACE}"
            git checkout -f "${ref_to_build}"

            local changed_post
            changed_post=$(git diff --name-only "${MAIN_SHA}...HEAD" -- '_posts/*.md' | head -n 1 || true)
            local slug=""
            if [ -n "${changed_post}" ]; then
              slug=$(basename "${changed_post}" .md | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')
            fi

            printf "pwa:\n  enabled: false\n" > _config_preview.yml
            rm -rf "/tmp/pr_site_${pr_num}"
            JEKYLL_ENV=production bundle exec jekyll b \
              --config _config.yml,_config_preview.yml \
              -b "/pr-preview/pr-${pr_num}" \
              -d "/tmp/pr_site_${pr_num}"
            rm -f _config_preview.yml

            local post_url_path=""
            if [ -n "${slug}" ] && [ -d "/tmp/pr_site_${pr_num}/posts/${slug}" ]; then
              post_url_path="posts/${slug}/"
            else
              local first_dir
              first_dir=$(ls -1 "/tmp/pr_site_${pr_num}/posts" 2>/dev/null | head -n 1 || true)
              if [ -n "${first_dir}" ]; then
                post_url_path="posts/${first_dir}/"
              fi
            fi

            rm -rf "${PREVIEW_REPO}/pr-preview/pr-${pr_num}"
            cp -R "/tmp/pr_site_${pr_num}" "${PREVIEW_REPO}/pr-preview/pr-${pr_num}"

            if [ "${send_comment}" = "true" ]; then
              export SITE_ROOT="https://${GITHUB_REPOSITORY_OWNER}.github.io"
              export PREVIEW_HOME="${SITE_ROOT}/pr-preview/pr-${pr_num}/"
              export PREVIEW_POST="${PREVIEW_HOME}${post_url_path}"
              python3 /tmp/build_pr_comment.py
              gh pr comment "${pr_num}" --body-file /tmp/pr_comment.md
            fi
          }

          # 2. PR 이벤트 처리 (닫힘/병합 시 삭제, 수정/오픈 시 재빌드)
          if [ "${EVENT_NAME}" = "pull_request_target" ]; then
            if [ "${PR_ACTION}" = "closed" ]; then
              echo "[Preview] Cleaning up closed/merged PR #${PR_NUMBER}..."
              rm -rf "${PREVIEW_REPO}/pr-preview/pr-${PR_NUMBER}"
            elif [ "${PR_HEAD_REPO}" = "${GITHUB_REPOSITORY}" ]; then
              cd "${GITHUB_WORKSPACE}"
              git fetch origin "${PR_HEAD_SHA}"
              build_and_store_pr "${PR_NUMBER}" "${PR_HEAD_SHA}" "true"
            fi
          fi

          # 3. 이미 열려 있는 동일 저장소 PR 중 아직 프리뷰가 없는 항목 자동 생성 (기존 오픈된 PR 지원)
          cd "${GITHUB_WORKSPACE}"
          OPEN_PRS=$(gh pr list --state open --json number,headRefName,isCrossRepository --jq '.[] | select(.isCrossRepository == false) | "\(.number) \(.headRefName)"' || true)
          if [ -n "${OPEN_PRS}" ]; then
            while read -r open_num open_branch; do
              [ -z "${open_num}" ] && continue
              if [ ! -d "${PREVIEW_REPO}/pr-preview/pr-${open_num}" ]; then
                git fetch origin "${open_branch}"
                build_and_store_pr "${open_num}" "origin/${open_branch}" "true"
              fi
            done <<< "${OPEN_PRS}"
          fi

          # 4. pr-previews 브랜치 변경사항 푸시
          cd "${PREVIEW_REPO}"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore(preview): sync active PR previews"
            git push origin pr-previews
          fi

          # 5. 메인 브랜치 최신 상태로 복귀
          cd "${GITHUB_WORKSPACE}"
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout -f "origin/${DEFAULT_BRANCH}"
          git clean -fd

      - name: Build production site (Main Blog)
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test production site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --allow-hash-href \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Bundle active PR previews into /pr-preview/
        run: |
          if [ -d "/tmp/pr_previews_repo/pr-preview" ] && [ -n "$(ls -A /tmp/pr_previews_repo/pr-preview 2>/dev/null)" ]; then
            mkdir -p "_site${{ steps.pages.outputs.base_path }}/pr-preview"
            cp -R /tmp/pr_previews_repo/pr-preview/* "_site${{ steps.pages.outputs.base_path }}/pr-preview/"
            echo "Attached PR previews:"
            ls -1 "_site${{ steps.pages.outputs.base_path }}/pr-preview"
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
